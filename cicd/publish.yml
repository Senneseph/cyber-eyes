name: Publish

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '16.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: './develop/package.json'
      
      - name: Install dependencies
        run: cd develop && npm ci
      
      - name: Build
        run: cd develop && npm run build
      
      - name: Test
        run: cd develop && npm test
      
      - name: Copy files for publishing
        run: |
          cp README.md develop/
          cp LICENSE develop/
          mkdir -p dist
          cp -r develop/dist/* dist/
      
      - name: Publish to npm
        run: cd develop && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Update dist directory
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist -f
          git commit -m "Update dist for release ${{ github.event.release.tag_name }}" || echo "No changes to commit"
          git push
